name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kaynak zip dosyasini ac
        run: |
          set -e
          test -f ezanpause-kaynak.zip || { echo "HATA: ezanpause-kaynak.zip dosyasi depoda yok. Once onu yukleyin."; exit 1; }
          mkdir -p _src
          unzip -q -o ezanpause-kaynak.zip -d _src
          P=$(dirname "$(find _src -name settings.gradle | head -1)")
          echo "PROJE_KLASORU=$P" >> "$GITHUB_ENV"
          ls -la "$P"
          echo "=== BU DERLEMENIN SURUMU ==="; grep -E "versionName|versionCode" "$P/app/build.gradle"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android lisanslarini kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK uret
        working-directory: ${{ env.PROJE_KLASORU }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: EzanPause-APK
          path: ${{ env.PROJE_KLASORU }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
